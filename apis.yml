aid: easyhealth
name: Easyhealth
description: >-
  EasyHealth is a Los Angeles-based value-based care company that partners with
  health plans, provider groups, and risk-bearing entities to deliver proactive,
  in-home and virtual clinical care to Medicare, Medicaid, and Health Exchange
  members across 40+ states. Its Preventative Care Platform combines a hybrid
  visit model (in-home medical assistants paired with virtual nurse
  practitioners), Health Information Exchange integration, and real-time data
  dashboards for health plans to close HEDIS/care gaps, complete annual wellness
  visits, run preventive screenings, and manage chronic conditions such as
  cardiovascular, respiratory, diabetes, kidney, and behavioral health. EasyHealth
  emphasizes reaching underserved and hard-to-reach populations, claiming roughly
  40% member engagement versus traditional sub-10% rates. The company is backed by
  Anthemis and QED Investors and is profiled here as an API Evangelist network
  company. EasyHealth publishes no public API, developer portal, or SDKs at this
  time; this profile captures its public identity and web properties.
